<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIF → Nome</title>
  <meta name="description" content="Descobre o nome pelo qual uma empresa é conhecida a partir do NIF.">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); }
    .hero { text-align: center; margin-bottom: 28px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 10px; letter-spacing: -.04em; }
    .subtitle { color: #657086; font-size: 1.08rem; margin: 0; }
    .card { background: white; border: 1px solid #e2e6ee; border-radius: 18px; padding: 22px; box-shadow: 0 10px 35px rgba(25, 35, 55, .07); }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; border: 1px solid #cbd2df; border-radius: 11px; padding: 14px 16px; font: inherit; font-size: 1.05rem; }
    button { border: 0; border-radius: 11px; padding: 0 22px; font: inherit; font-weight: 650; cursor: pointer; background: #172033; color: white; }
    button:hover { opacity: .9; }
    .hint { color: #7a8497; font-size: .9rem; margin: 10px 2px 0; }
    #result { margin-top: 18px; }
    .result { border-top: 1px solid #e5e8ee; padding-top: 20px; }
    .public-name { font-size: 1.7rem; font-weight: 750; margin-bottom: 4px; }
    .legal { color: #667085; margin-bottom: 18px; }
    dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 16px; margin: 0; }
    dt { color: #7b8495; } dd { margin: 0; }
    .confidence { display: inline-block; margin-top: 18px; padding: 6px 9px; border-radius: 999px; background: #eef7ef; color: #28653a; font-size: .85rem; font-weight: 650; }
    .empty { color: #687386; padding: 8px 0; }
    footer { text-align: center; color: #8992a3; font-size: .82rem; margin-top: 22px; }
    @media (max-width: 560px) { form { flex-direction: column; } button { min-height: 48px; } dl { grid-template-columns: 1fr; gap: 3px; } dd { margin-bottom: 8px; } }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>NIF → Nome</h1>
    <p class="subtitle">Descobre quem está por trás do nome que aparece no teu extrato ou e-Fatura.</p>
  </section>
  <section class="card">
    <form id="searchForm">
      <input id="nif" name="nif" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="Introduz o NIF (ex.: 512044821)" aria-label="NIF">
      <button type="submit">Pesquisar</button>
    </form>
    <p class="hint">Por agora estamos a testar a base inicial.</p>
    <div id="result" aria-live="polite"></div>
  </section>
  <footer>Projeto comunitário NIF → Nome · informação com fontes e evidências</footer>
</main>
<script>
const seed = {
  "512044821": {
    publicName: "FARMÁCIA CORREA",
    legalName: "SOUSA & SILVA, LDA",
    location: "Horta, Açores",
    confidence: "Correspondência forte",
    source: "Empresite — designação comercial"
  }
};

function render(data) {
  const result = document.querySelector('#result');
  if (!data) {
    result.innerHTML = '<div class="empty">Ainda não temos uma correspondência para este NIF. Em breve poderás também sugerir um nome e indicar a fonte.</div>';
    return;
  }
  result.innerHTML = `
    <div class="result">
      <div class="public-name">${data.publicName}</div>
      <div class="legal">${data.legalName}</div>
      <dl>
        <dt>NIF</dt><dd>${document.querySelector('#nif').value.replace(/\D/g, '')}</dd>
        <dt>Local</dt><dd>${data.location}</dd>
        <dt>Fonte</dt><dd>${data.source}</dd>
      </dl>
      <span class="confidence">✓ ${data.confidence}</span>
    </div>`;
}

document.querySelector('#searchForm').addEventListener('submit', event => {
  event.preventDefault();
  const nif = document.querySelector('#nif').value.replace(/\D/g, '');
  if (nif.length !== 9) {
    document.querySelector('#result').innerHTML = '<div class="empty">Introduz um NIF/NIPC válido com 9 dígitos.</div>';
    return;
  }
  render(seed[nif]);
});
</script>
</body>
</html>
