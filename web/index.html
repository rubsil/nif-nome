<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIF → Nome</title>
  <meta name="description" content="Descobre o nome pelo qual uma empresa é conhecida a partir do NIF.">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(800px, 100%); }
    .hero { text-align: center; margin-bottom: 28px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 10px; letter-spacing: -.04em; }
    .subtitle { color: #657086; font-size: 1.08rem; margin: 0; }
    .card { background: white; border: 1px solid #e2e6ee; border-radius: 18px; padding: 22px; box-shadow: 0 10px 35px rgba(25, 35, 55, .07); }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; border: 1px solid #cbd2df; border-radius: 11px; padding: 14px 16px; font: inherit; font-size: 1.05rem; }
    button { border: 0; border-radius: 11px; padding: 0 22px; font: inherit; font-weight: 650; cursor: pointer; background: #172033; color: white; }
    button:hover { opacity: .9; }
    .hint { color: #7a8497; font-size: .9rem; margin: 10px 2px 0; }
    #result { margin-top: 18px; }
    .company-profile { border-top: 1px solid #e5e8ee; padding-top: 22px; }
    .company-header { margin-bottom: 18px; }
    .eyebrow { color: #657086; text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; font-weight: 750; }
    h2 { font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 4px 0; letter-spacing: -.03em; }
    h3 { font-size: 1.05rem; margin: 24px 0 10px; }
    .legal { color: #667085; margin: 0; }
    .company-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
    .company-meta div { background: #f7f8fb; border-radius: 12px; padding: 12px 14px; }
    .company-meta span { display: block; color: #7b8495; font-size: .78rem; margin-bottom: 3px; }
    .company-meta strong { font-size: .95rem; }
    .public-name-card { border: 1px solid #e1e5ec; border-radius: 14px; padding: 16px; margin: 10px 0; }
    .public-name { font-size: 1.45rem; font-weight: 750; }
    .name-type { color: #7b8495; font-size: .82rem; margin-top: 2px; }
    .confidence-row { display: flex; align-items: center; gap: 9px; margin-top: 12px; }
    .confidence { display: inline-block; padding: 6px 9px; border-radius: 999px; font-size: .82rem; font-weight: 700; }
    .confidence.high { background: #e5f5e8; color: #246137; }
    .confidence.medium { background: #fff3d9; color: #795b18; }
    .confidence.low { background: #f1f2f5; color: #626b7c; }
    .confidence-row strong { color: #667085; font-size: .85rem; }
    .sources { margin-top: 15px; padding-top: 13px; border-top: 1px solid #e8ebf0; font-size: .88rem; }
    .source-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; }
    .source-list li { display: flex; justify-content: space-between; gap: 10px; }
    .source-list a { color: #172033; }
    .source-list span { color: #8992a3; white-space: nowrap; font-size: .8rem; }
    .profile-note { margin-top: 22px; padding: 12px 14px; border-radius: 10px; background: #f7f8fb; color: #687386; font-size: .84rem; line-height: 1.45; }
    .result-summary { color: #7a8497; font-size: .85rem; margin-bottom: 4px; }
    .muted, .empty { color: #687386; }
    .empty { padding: 8px 0; }
    .empty strong { display: block; color: #172033; margin-bottom: 10px; }
    .empty button { margin-top: 8px; min-height: 42px; }
    .suggestion { border-top: 1px solid #e5e8ee; padding-top: 20px; display: grid; gap: 10px; }
    .suggestion p { color: #687386; margin: 0 0 4px; font-size: .92rem; }
    .suggestion label { display: grid; gap: 5px; font-size: .9rem; font-weight: 600; }
    .suggestion button { min-height: 44px; }
    #suggestStatus { color: #28653a; font-size: .9rem; }
    footer { text-align: center; color: #8992a3; font-size: .82rem; margin-top: 22px; }
    @media (max-width: 560px) { form { flex-direction: column; } button { min-height: 48px; } .company-meta { grid-template-columns: 1fr; } .source-list li { display: grid; gap: 2px; } .source-list span { white-space: normal; } }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>NIF → Nome</h1>
    <p class="subtitle">Descobre quem está por trás do nome que aparece no teu extrato ou e-Fatura.</p>
  </section>
  <section class="card">
    <form id="searchForm">
      <input id="nif" name="nif" inputmode="text" autocomplete="off" maxlength="200" placeholder="NIF ou nome da empresa…" aria-label="NIF ou nome da empresa">
      <button type="submit">Pesquisar</button>
    </form>
    <p class="hint">Pesquisa por NIF, nome legal, nome comercial ou localização.</p>
    <div id="result" aria-live="polite"></div>
  </section>
  <footer>Projeto comunitário NIF → Nome · informação com fontes e evidências</footer>
</main>
<script src="./app.js" defer></script>
</body>
</html>
